version: '3.8'

services:
  db:
    image: postgis/postgis:15-3.3
    container_name: touchroute_db
    environment:
      POSTGRES_USER: touchroute
      POSTGRES_PASSWORD: touchroute_password
      POSTGRES_DB: touchroute_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U touchroute -d touchroute_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: touchroute_backend
    environment:
      - DATABASE_URL=postgresql://touchroute:touchroute_password@db:5432/touchroute_db
      - ENVIRONMENT=production
      - AI_PROVIDER=gemini
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - META_API_KEY=${META_API_KEY:-}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads_data:/app/backend/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: touchroute_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  uploads_data:

